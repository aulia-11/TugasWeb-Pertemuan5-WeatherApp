<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather App</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="weather-app">

        <div class="weather-card">

            <h1>Weather App</h1>
            <p class="subtitle">Cek kondisi cuaca di kotamu</p>

            <form id="searchForm" class="search-box">
                <input
                    type="text"
                    id="cityInput"
                    placeholder="Masukkan nama kota..."
                    autocomplete="off"
                >

                <button type="submit">Cari</button>
            </form>

            <div class="unit-toggle">
                <button id="celsiusBtn" class="active">°C</button>
                <button id="fahrenheitBtn">°F</button>
            </div>

            <div id="loading" class="loading hidden">
                <div class="spinner"></div>
                <p>Mengambil data cuaca...</p>
            </div>

            <div id="errorMessage" class="error-message hidden"></div>

            <section id="weatherResult" class="weather-result hidden">

                <div class="location">
                    <h2 id="cityName">Medan</h2>
                    <p id="weatherDescription">Cerah</p>
                </div>

                <div class="weather-main">
                    <img id="weatherIcon" src="" alt="Ikon cuaca">

                    <div>
                        <p id="temperature">--°C</p>
                    </div>
                </div>

                <div class="weather-info">

                    <div class="info-box">
                        <span>💧</span>
                        <p>Kelembapan</p>
                        <strong id="humidity">--%</strong>
                    </div>

                    <div class="info-box">
                        <span>🌬️</span>
                        <p>Kecepatan Angin</p>
                        <strong id="windSpeed">-- m/s</strong>
                    </div>

                </div>

            </section>

            <section class="history-section">

                <h3>Riwayat Pencarian</h3>

                <div id="searchHistory" class="history-list">
                    <p class="empty-history">Belum ada riwayat pencarian.</p>
                </div>

            </section>

        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
